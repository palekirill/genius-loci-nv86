<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="nv86 is an interactive point-and-click world you can explore right in your browser, created with love and entirely with the help of ai">
    <meta name="theme-color" content="#000000">
    <title>genius_loci_nv86</title>
    <meta property="og:title" content="genius_loci_nv86">
    <meta property="og:description" content="nv86 is an interactive point-and-click world you can explore right in your browser, created with love and entirely with the help of ai">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://palekirill.github.io/genius-loci-nv86/cover.png">
    <meta property="og:url" content="https://palekirill.github.io/genius-loci-nv86/">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        body.minigame-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            cursor: none;
        }
        
        #gameCanvas {
            display: block;
            cursor: pointer;
            margin: 0 auto;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        #introOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            color: #FFFFFF;
            font-size: 18px;
            line-height: 1.6;
            z-index: 1000;
            text-align: center;
            padding: 0 20px 60px;
            pointer-events: none;
            background: transparent;
            font-family: "Arial Narrow", Arial, sans-serif;
        }
        
        #introOverlay .intro-logo-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: flex-start;
            gap: 0.2em;
        }
        
        #introOverlay .intro-logo {
            width: min(44vw, 260px);
            height: auto;
            display: block;
            pointer-events: none;
            flex-shrink: 0;
        }
        
        #introOverlay .intro-label {
            font-size: 11px;
            font-family: Arial, sans-serif;
            font-style: italic;
            color: #FFFFFF;
            text-transform: lowercase;
            white-space: nowrap;
            margin-top: 0.15em;
            pointer-events: none;
        }
        
        #introOverlay .loading-progress {
            min-height: 52px;
            text-align: left;
            display: inline-block;
        }
        
        #introOverlay .loading-progress .loading-percent {
            color: #15FF00;
        }
        
        #introOverlay .loading-progress .click-to-start {
            color: #15FF00;
            animation: blink 1s infinite;
            display: inline-block;
            pointer-events: auto;
        }
        
        #introOverlay.clickable {
            cursor: pointer;
        }
        
        #introOverlay.clickable * {
            pointer-events: auto;
        }
        
        body.minigame-mode #gameCanvas {
            position: relative;
            top: auto;
            left: auto;
            box-shadow: 0 0 0 2px #333;
            cursor: none;
            transition: box-shadow 0.05s ease-out;
        }
        
        body.minigame-mode.frame-catch #gameCanvas {
            box-shadow: 0 0 0 4px #00FF00;
        }
        
        body.minigame-mode.frame-miss #gameCanvas {
            box-shadow: 0 0 0 4px #FF0000;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        #sourceCodeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            color: #00FF00;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            padding: 30px;
            overflow: auto;
            z-index: 2000;
            display: none;
            cursor: pointer;
        }
        
        #sourceCodeOverlay .code-display {
            color: #CCCCCC;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        #sourceCodeOverlay .click-message {
            color: #15FF00;
            animation: blink 1s infinite;
            margin-top: 30px;
            font-size: 14px;
        }
        
        #subtitle {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-style: italic;
            text-align: center;
            z-index: 3000;
            display: none;
            padding: 4px 8px;
            background: #000000;
            width: fit-content;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #prayer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-style: italic;
            text-align: center;
            z-index: 3000;
            display: none;
            white-space: pre-line;
            line-height: 1.6;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 40px rgba(255, 255, 255, 0.2);
            pointer-events: auto;
        }
        
        #prayer.fade-in {
            animation: fadeIn 2s ease-in;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="introOverlay">
        <div class="intro-logo-wrap">
            <img src="logo.svg" alt="genius loci" class="intro-logo" id="introLogoImage">
            <span class="intro-label" id="introLabel"></span>
        </div>
        <div class="loading-progress" id="loadingProgress">
            <div>&gt; loading assets... this may take a few minutes (<span class="loading-percent" id="loadingPercent">0%</span>)</div>
            <div>&gt; thank you for your patience</div>
        </div>
    </div>
    <div id="sourceCodeOverlay"></div>
    <div id="subtitle"></div>
    <div id="prayer"></div>
    
    <script src="game.js"></script>
</body>
</html>
